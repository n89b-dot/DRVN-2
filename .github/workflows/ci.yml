name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders: the build must not depend on real
          # credentials, and env validation should fail loudly if it ever does.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com

  # The commerce guarantees live in Postgres (conditional UPDATEs, terminal-
  # state guards, dispute constraints, notification triggers) — Node tests
  # cannot see them. This job rebuilds the schema from the migration files on
  # Supabase's own Postgres image (auth/storage schemas and pg_cron included)
  # and runs the nine-assertion guard in supabase/tests/purchase_guard.sql.
  sql-guard:
    runs-on: ubuntu-latest
    services:
      db:
        image: supabase/postgres:15.14.1.158
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply all migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/ci_shim.sql
          for f in supabase/migrations/*.sql; do
            echo "== applying $f"
            psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: All SQL guards (independent results)
        env:
          PGPASSWORD: postgres
        run: bash scripts/test-sql-guards.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generated database contract matches migrations
        env:
          DRVN_TYPES_DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/postgres
        run: node scripts/generate-database-types.mjs --check

  # The golden-path e2e suite (signup → list → buy → dispatch → receive) needs
  # a real Supabase project — auth included — so it runs against a dedicated
  # throwaway project configured via repository secrets. Without them the job
  # skips loudly rather than failing, so forks and secretless runs stay green.
  # Configure: E2E_SUPABASE_URL, E2E_SUPABASE_PUBLISHABLE_KEY,
  # E2E_SUPABASE_SECRET_KEY (a project with migrations applied and email
  # confirmation off).
  e2e:
    outputs:
      ran: ${{ steps.gate.outputs.run }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      E2E_TEST_PROJECT_REF: ${{ secrets.E2E_TEST_PROJECT_REF }}
      PAYMENTS_MODE: stub
      PAYMENTS_ALLOW_STUB_IN_PRODUCTION: 'true'
      GUEST_RECEIPT_SECRET: ci-only-guest-signing-secret-at-least-32-characters
    steps:
      - name: Check for e2e project secrets
        id: gate
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$E2E_TEST_PROJECT_REF" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E secrets not configured — golden-path suite skipped."
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - if: steps.gate.outputs.run == 'true'
        name: Golden path
        run: npm run test:e2e

  # Stripe test-mode integration (tests/stripe): intent metadata, confirm,
  # declines, refunds and the per-order idempotency contract against the real
  # Stripe test API. Gated on a test-mode secret; the suite itself refuses
  # non-sk_test_ keys. Skips loudly — a skip is stated, never counted as green
  # coverage.
  stripe-integration:
    # Both suites use the same disposable project: keep their fixtures isolated in time.
    needs: [e2e]
    outputs:
      ran: ${{ steps.gate.outputs.run }}
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
      E2E_TEST_PROJECT_REF: ${{ secrets.E2E_TEST_PROJECT_REF }}
    steps:
      - name: Check for Stripe test secret
        id: gate
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$E2E_TEST_PROJECT_REF" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STRIPE_TEST_SECRET_KEY not configured — Stripe integration suite skipped."
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      - if: steps.gate.outputs.run == 'true'
        name: Stripe test-mode integration
        run: npm run test:stripe

  release-gate:
    if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [verify, sql-guard, e2e, stripe-integration]
    steps:
      - name: Require executed verification
        env:
          VERIFY: ${{ needs.verify.result }}
          SQL: ${{ needs.sql-guard.result }}
          E2E: ${{ needs.e2e.result }}
          STRIPE: ${{ needs.stripe-integration.result }}
          E2E_RAN: ${{ needs.e2e.outputs.ran }}
          STRIPE_RAN: ${{ needs.stripe-integration.outputs.ran }}
        run: |
          test "$VERIFY" = success
          test "$SQL" = success
          test "$E2E" = success && test "$E2E_RAN" = true
          test "$STRIPE" = success && test "$STRIPE_RAN" = true

  # The honest green: says out loud what did and didn't run, so a passing
  # build can't be mistaken for full coverage.
  summary:
    runs-on: ubuntu-latest
    needs: [verify, sql-guard, e2e, stripe-integration]
    if: always()
    steps:
      - name: Coverage summary
        run: |
          {
            echo "## What this build actually verified"
            echo ""
            echo "| Suite | Result |"
            echo "|---|---|"
            echo "| Typecheck / lint / unit / build | ${{ needs.verify.result }} |"
            echo "| SQL guards (all registered suites) | ${{ needs.sql-guard.result }} |"
            echo "| E2E golden path | ${{ needs.e2e.result }}; executed=${{ needs.e2e.outputs.ran }} |"
            echo "| Stripe test-mode integration | ${{ needs.stripe-integration.result }}; executed=${{ needs.stripe-integration.outputs.ran }} |"
            echo "| Multi-seller settlement / transfers / dispute recovery | exercised by the stub-mode golden path only — full Stripe-backed E2E remains future coverage |"
          } >> "$GITHUB_STEP_SUMMARY"
