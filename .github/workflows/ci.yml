name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_diagnostic_retries:
        description: Retry a failed browser suite for diagnosis only (never satisfies the release gate)
        required: false
        default: false
        type: boolean

# On a pull request, a newer push supersedes the run in flight. On main, a run
# always finishes: cancelling it on every merge left main with almost no finished
# run on a busy day (7 Nov: 15 cancelled, 3 finished), so no merge got proof.
# GitHub keeps one run going and one waiting per ref, and a newer push replaces
# the waiting one, so a burst of merges is checked together by the next run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege (the repository is public): every job's GITHUB_TOKEN can
# only read the code. A job that needs more declares it on the job itself
# (today only `secrets`, which reads the PR's commit list). This workflow
# runs on `pull_request`, never `pull_request_target`, so a fork's PR gets
# no repository secrets and a read-only token — see stripe-integration's gate.
permissions:
  contents: read

jobs:
  # Plan 2 item A0: does this pull request change documents only? If it does,
  # the browser suite (`e2e`, 20 to 30 minutes) is skipped and release-gate
  # accepts the skip. Only a pull request can be documents-only: a push to main
  # and a manual run always get the full suite, so every commit on main is
  # still proven by the browser tests. The rules are in
  # scripts/ci-change-scope.mjs (tests/ci/change-scope.test.ts); on any doubt
  # or error the answer is "full".
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # On a pull request HEAD is the merge commit; depth 2 brings its
          # base parent (HEAD^1), which the script diffs against.
          fetch-depth: 2
      # The runner's own Node: the script has no dependencies, so no npm ci.
      - name: Decide the change scope
        id: scope
        run: node scripts/ci-change-scope.mjs

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # On a pull request HEAD is the merge commit; depth 2 brings its
          # base parent (HEAD^1), which tests/ci/test-ids.test.ts diffs against.
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      # RR-23: a production dependency with a known high or critical advisory
      # fails the build. Dev-only tooling is reviewed separately so a test
      # runner advisory can't block a release it never ships in.
      - name: Production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # Zero warnings, not just zero errors: a warning that is real gets
      # fixed, a deliberate exception carries an inline reason.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      # tests/ci/pr-resolves.test.ts and tests/ci/test-ids.test.ts read the
      # PR's title and description (docs/ids.md). Passed through env, never
      # interpolated into the script. Empty on a push, where those checks skip.
      - name: Tests
        run: npm test
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DIFF_BASE: HEAD^1

      - name: Independent monitor contract
        run: npm run test:monitor

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders: the build must not depend on real
          # credentials, and env validation should fail loudly if it ever does.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com

      # JUnit for the Intelligence OS: every job's files share the prefix
      # test-results-<sha>- (docs/ids.md). Kept on red runs too.
      - name: Retain JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.sha }}-verify
          path: |
            test-results/vitest.xml
          if-no-files-found: warn
          retention-days: 30

  # RR-23: no credential in the code or its history — two lanes.
  #
  # `secrets` is the INCREMENTAL lane: gitleaks-action scans only what this
  # event added — on a pull request `--no-merges --first-parent base^..head`,
  # on a push the pushed commits. It annotates the PR. It does not see merge
  # commits, or anything already on the base branch.
  #
  # `secrets-full` (below) is the FULL lane: every commit reachable from any
  # fetched ref, merge commits included, plus the tracked tree as checked out.
  # That is the lane that fails a key which was committed and later deleted,
  # until it is rotated and allowlisted with a reason.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # On pull requests the action lists the PR's commits through the API;
    # the default token can't, so it gets read access to exactly that.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's own default, made explicit so both lanes run the
          # same scanner. Bump together with secrets-full's version + checksum.
          GITLEAKS_VERSION: 8.24.3

  secrets-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.24.3
      # sha256 of gitleaks_8.24.3_linux_x64.tar.gz, from the release's
      # gitleaks_8.24.3_checksums.txt. A different download fails the job.
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Every branch and tag, with full history — the scope of the scan.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # History: `git log -p -U0 --all --diff-merges=separate`. --all is every
      # fetched ref (branches, tags, this PR's merge ref); --diff-merges=separate
      # diffs a merge commit against each parent, so a secret introduced while
      # resolving a merge is seen — plain `git log -p` prints no diff for merges.
      # Tree: the tracked files at HEAD, exported with `git archive` so an
      # untracked or ignored file on the runner can't enter the scope. Both
      # lanes run before the job decides; reports are --redact'ed.
      - name: Scan full history and tracked tree
        run: |
          set -u
          out="$RUNNER_TEMP/secret-scan"
          tree="$RUNNER_TEMP/tracked-tree"
          mkdir -p "$out" "$tree"
          git archive --format=tar HEAD | tar -x -C "$tree"

          # One config for both lanes, pinned by path: the repo's own if it
          # has one, otherwise gitleaks' built-in rules.
          config="gitleaks built-in default rules (no .gitleaks.toml)"
          if [ -f .gitleaks.toml ]; then
            export GITLEAKS_CONFIG="$PWD/.gitleaks.toml"
            config=".gitleaks.toml (blob $(git hash-object .gitleaks.toml))"
          fi
          ignore="none"
          if [ -f .gitleaksignore ]; then ignore=".gitleaksignore (blob $(git hash-object .gitleaksignore))"; fi
          common=(--redact --no-banner --exit-code=2 --report-format=json)

          history_opts="--all --diff-merges=separate"
          # The step shell is `bash -e`: capture each exit so the second lane
          # and the reports still run when the first finds something.
          history_exit=0
          gitleaks git "${common[@]}" --log-opts="$history_opts" \
            --report-path="$out/history.json" . || history_exit=$?
          # Run from inside the export so fingerprints are repo-relative and
          # the tracked .gitleaksignore applies.
          tree_exit=0
          (cd "$tree" && gitleaks dir "${common[@]}" --report-path="$out/tree.json" .) || tree_exit=$?

          count() { [ -s "$1" ] && jq 'length' "$1" || echo "n/a"; }
          jq -n \
            --arg version "$(gitleaks version)" \
            --arg config "$config" \
            --arg ignore "$ignore" \
            --arg source_sha "$(git rev-parse HEAD)" \
            --arg github_sha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --arg history_opts "git log -p -U0 $history_opts" \
            --argjson refs "$(git for-each-ref --format='%(refname)' | wc -l)" \
            --argjson commits "$(git rev-list --all --count)" \
            --argjson merges "$(git rev-list --all --merges --count)" \
            --argjson tracked_files "$(git ls-files | wc -l)" \
            --arg history_findings "$(count "$out/history.json")" \
            --arg tree_findings "$(count "$out/tree.json")" \
            --argjson history_exit "$history_exit" \
            --argjson tree_exit "$tree_exit" \
            '{scanner: "gitleaks", version: $version, config: $config, ignore: $ignore,
              source_sha: $source_sha, github_sha: $github_sha, event: $event, ref: $ref,
              history: {scope: "all reachable commits incl. merges", log_opts: $history_opts,
                        refs: $refs, commits: $commits, merges: $merges,
                        findings: $history_findings, exit: $history_exit},
              tree: {scope: "tracked files at source_sha (git archive)", files: $tracked_files,
                     findings: $tree_findings, exit: $tree_exit}}' > "$out/scope.json"

          {
            echo "### Secret scan — full history + tracked tree"
            echo ""
            echo '```json'
            cat "$out/scope.json"
            echo '```'
            # Rule, file, commit and line only — never the match.
            for lane in history tree; do
              if [ -s "$out/$lane.json" ] && [ "$(jq 'length' "$out/$lane.json")" -gt 0 ]; then
                echo ""
                echo "**$lane findings** (redacted)"
                echo ""
                jq -r '.[] | "- \(.RuleID) · \(.File):\(.StartLine)" + (if .Commit != "" then " · \(.Commit[0:12])" else "" end)' "$out/$lane.json"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          test "$history_exit" -eq 0 && test "$tree_exit" -eq 0

      - name: Upload secret-scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scan-full
          path: ${{ runner.temp }}/secret-scan/
          retention-days: 14
          if-no-files-found: error

  # The commerce guarantees live in Postgres (conditional UPDATEs, terminal-
  # state guards, dispute constraints, notification triggers) — Node tests
  # cannot see them. This job rebuilds the schema from every migration file on
  # Supabase's own Postgres image (auth schema and pg_cron included; storage
  # comes from supabase/tests/ci_shim.sql) and runs every
  # supabase/tests/*_guard.sql suite.
  #
  # The image is the one supabase/config.toml declares (`[db] major_version =
  # 17`) and the one Supabase CLI 2.116.0 starts for that major in the e2e and
  # stripe-integration jobs (its templates/Dockerfile pins
  # supabase/postgres:17.6.1.165), so migrations and guards run on the same
  # Postgres as the browser suite. The first step fails if they ever drift.
  sql-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        # supabase/postgres:17.6.1.165, linux/amd64 manifest; the digest
        # prevents a mutable tag from changing the database beneath the guards.
        image: supabase/postgres@sha256:fc542c31f334749adbbd3c9e16b6be90f17d0fe6460d5196066d73f2723c9ecf
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Database major matches supabase/config.toml
        env:
          PGPASSWORD: postgres
        run: |
          declared=$(awk '/^\[db\]/{db=1; next} /^\[/{db=0} db && /^major_version *=/{gsub(/[^0-9]/, ""); print}' supabase/config.toml)
          running=$(psql -h localhost -U supabase_admin -d postgres -tA -c "select current_setting('server_version_num')::int / 10000")
          echo "supabase/config.toml declares Postgres ${declared:-?}; sql-guard runs $(psql -h localhost -U supabase_admin -d postgres -tA -c 'select version()')"
          if [ -z "$declared" ] || [ "$declared" != "$running" ]; then
            echo "::error::sql-guard runs Postgres $running but supabase/config.toml declares ${declared:-nothing}. Pin the services.db image to the supabase/postgres release the CLI starts for that major."
            exit 1
          fi

      - name: Apply all migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/ci_shim.sql
          for f in supabase/migrations/*.sql; do
            echo "== applying $f"
            psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: All SQL guards (independent results)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGPASSWORD: postgres
        run: bash scripts/test-sql-guards.sh

      # JUnit for the Intelligence OS: every job's files share the prefix
      # test-results-<sha>- (docs/ids.md). Kept on red runs too.
      - name: Retain JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.sha }}-sql-guard
          path: |
            test-results/sql-guards.xml
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      # CLI 2.116.0 type generation directly requests this ECR tag. Shared
      # runner egress hit ECR's rate limit; prefetch the same pinned official
      # linux/amd64 release from GHCR and supply its expected local alias.
      - name: Prepare pinned schema generator image
        run: |
          image=ghcr.io/supabase/postgres-meta@sha256:4f23a37bc0e3a153463b62cecb71409972660fe97f66cc772989d89d628fafd1
          for attempt in 1 2 3; do
            if docker pull "$image"; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          docker tag "$image" public.ecr.aws/supabase/postgres-meta:v0.98.0

      - name: Generated database contract matches migrations
        env:
          DRVN_TYPES_DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/postgres
          DRVN_TYPES_MISMATCH_OUT: ${{ runner.temp }}/database.generated.ts
        run: node scripts/generate-database-types.mjs --check

      # On a mismatch, keep the file the generator produced so a branch can
      # take it as-is (download the artifact, copy it to
      # src/lib/database.generated.ts) without running a local database.
      - name: Keep the generated schema when it differs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-generated-${{ github.sha }}
          path: ${{ runner.temp }}/database.generated.ts
          if-no-files-found: ignore
          retention-days: 7

  # The browser suite, in four parts side by side (plan 2 item A0b). One job
  # took about 20 minutes, twelve of them the suite itself on a single worker.
  # e2e/parts.json splits the spec files into four parts of near-equal
  # measured time; each part is this job once, with its own fresh Supabase
  # stack and its own build, and one worker inside it because the tests share
  # database state. Together the parts run every test of the unsplit suite
  # exactly once (tests/ci/e2e-parts.test.ts lists both and compares). The
  # `e2e` job below judges the four and merges their results.
  #
  # Skipped on a documents-only pull request (the `changes` job, plan 2 item
  # A0). release-gate accepts that skip only when `changes` succeeded and said
  # so; a skip for any other reason keeps the gate red.
  e2e-parts:
    name: e2e part ${{ matrix.part }}
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      # A failing part must not cancel the others: each part's result is evidence.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PAYMENTS_MODE: stub
      PAYMENTS_ALLOW_STUB_IN_PRODUCTION: 'true'
      RELEASE_SUMMARY_DIR: release-results
      E2E_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      # Which browsers this part needs, and whether it is the one part that
      # runs the recovery drills: both read from e2e/parts.json.
      - name: Plan this part
        id: plan
        run: node scripts/ci-e2e-parts.mjs plan "$E2E_PART"
      # RR-16: Realtime runs here, so live message and badge delivery is
      # tested by subscription (e2e/realtime-delivery.spec.ts), not by the
      # fallback refresh.
      # Each attempt is time-boxed (scripts/ci-supabase-start.sh): a stalled
      # image pull or health wait is retried instead of running until the
      # job's timeout-minutes kills it.
      - name: Start isolated Supabase with captured email
        run: bash scripts/ci-supabase-start.sh logflare,vector,studio,edge-runtime,imgproxy
      - run: node scripts/prepare-ci-supabase.mjs
      # The recovery drills run once, in one part, not four times.
      - name: Start isolated Typesense
        if: steps.plan.outputs.operations == 'true'
        run: |
          for attempt in 1 2 3; do
            if docker pull typesense/typesense@sha256:b405d4443bdb9254fab4792b7fd9ee95d969f3b5485975917a3a3f84274eba27; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); else exit 1; fi
          done
          docker run -d --name drvn-typesense -p 8108:8108 typesense/typesense@sha256:b405d4443bdb9254fab4792b7fd9ee95d969f3b5485975917a3a3f84274eba27 --data-dir /tmp --api-key drvn-local-isolated-test-key
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8108/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Storage, deletion and search recovery drills
        if: steps.plan.outputs.operations == 'true'
        run: npm run test:operations
      - name: Stop test search engine
        if: always() && steps.plan.outputs.operations == 'true'
        run: docker stop drvn-typesense
      - name: Install this part's browsers
        env:
          BROWSERS: ${{ steps.plan.outputs.browsers }}
        run: npx playwright install --with-deps $BROWSERS
      - name: Required browser regression suite
        id: executed
        env:
          # Pin the release invocation to first-attempt evidence even if a
          # similarly named repository/environment variable is introduced.
          E2E_DIAGNOSTIC_RETRIES: '0'
        run: |
          echo "ran=true" >> "$GITHUB_OUTPUT"
          npm run test:e2e
          echo "first_attempt_passed=true" >> "$GITHUB_OUTPUT"

      # Diagnosis only: runs after the required suite already failed, so the
      # job (and release-gate) stay red whatever this step finds.
      - name: Optional browser retry diagnostics
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.run_diagnostic_retries
        env:
          E2E_DIAGNOSTIC_RETRIES: '2'
        run: |
          echo "::notice::Diagnostic browser retries (up to 2). The release result is the failed first attempt above; this rerun never changes it."
          npm run test:e2e

      # What this part did, for the `e2e` job to judge. Written on every
      # outcome: a part with no result file counts as a part that did not run.
      - name: Record this part's result
        if: always()
        env:
          RAN: ${{ steps.executed.outputs.ran }}
          FIRST_ATTEMPT_PASSED: ${{ steps.executed.outputs.first_attempt_passed }}
        run: node scripts/ci-e2e-parts.mjs record "$E2E_PART" e2e-part

      - name: Retain this part's results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-part-${{ matrix.part }}-${{ github.sha }}
          path: |
            e2e-part/part.json
            release-results/browser-release-${{ github.sha }}.json
            test-results/operations.xml
            test-results/playwright.xml
            test-results/playwright-diagnostic.xml
            test-results/design/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-failure-details-part-${{ matrix.part }}
          path: test-results/
          retention-days: 3

  # Judges the four parts and merges what they wrote. The rule is the one the
  # gate has always had, now per part: every part ran and passed on its first
  # attempt. A part that is missing, skipped, cancelled or failed fails this
  # job. It also writes the files a single-job suite used to write, under the
  # same artifact names (browser-release-summary-<sha>, test-results-<sha>-e2e,
  # design-screenshots-<sha>), so their readers do not change.
  #
  # Runs when a part has failed, so a red run keeps its merged results; does
  # not run on a documents-only pull request, where there is nothing to judge.
  e2e:
    needs: [changes, e2e-parts]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    outputs:
      ran: ${{ steps.merge.outputs.ran }}
      # True only when every part's required step passed on its first attempt.
      # A diagnostic retry cannot set a part's own flag, so it can never
      # satisfy release-gate.
      first_attempt_passed: ${{ steps.merge.outputs.first_attempt_passed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Fetch every part's results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-part-*-${{ github.sha }}
          path: ${{ runner.temp }}/e2e-parts
      # The runner's own Node: the script has no dependencies, so no npm ci.
      - name: Judge the parts and merge their results
        id: merge
        env:
          PARTS_DIR: ${{ runner.temp }}/e2e-parts
        run: node scripts/ci-e2e-parts.mjs merge "$PARTS_DIR" .

      - name: Retain candidate-indexed browser summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-release-summary-${{ github.sha }}
          path: release-results/browser-release-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30

      # JUnit for the Intelligence OS: every job's files share the prefix
      # test-results-<sha>- (docs/ids.md). Kept on red runs too.
      - name: Retain JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.sha }}-e2e
          path: |
            test-results/operations.xml
            test-results/playwright.xml
            test-results/playwright-diagnostic.xml
          if-no-files-found: warn
          retention-days: 30

      # Screens specs save on purpose (test-results/design/), kept on green
      # runs too, so a build can be compared with its design PNGs.
      - name: Retain design screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-screenshots-${{ github.sha }}
          path: test-results/design/
          if-no-files-found: ignore
          retention-days: 14

  # Stripe test-mode integration (tests/stripe): intent metadata, confirm,
  # declines, refunds and the per-order idempotency contract against the real
  # Stripe test API. The suite itself refuses non-sk_test_ keys, and a missing
  # required secret fails this lane explicitly.
  stripe-integration:
    # Runs beside the browser suite, not after it (plan 2 item A0): it takes
    # about two minutes and release-gate requires both, so waiting on e2e only
    # delayed the answer.
    #
    # Skipped on a documents-only pull request, as the browser lanes are (plan
    # 2 finding F1). A change to documents cannot affect Stripe, and every run
    # of this lane creates 49 test events that Stripe delivers to everything
    # listening on the same sandbox. release-gate accepts the skip only when
    # `changes` succeeded and said the diff is documents only.
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    outputs:
      ran: ${{ steps.gate.outputs.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      # GitHub never passes repository secrets to a pull request from a fork,
      # so on a fork PR this lane cannot run and release-gate stays red. Say
      # exactly that, instead of a bare "secret missing".
      - name: Require Stripe test secret
        id: gate
        env:
          FORK_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.head.repo.full_name || '' }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          if [ -n "$FORK_REPO" ]; then
            message="This pull request comes from the fork $FORK_REPO. GitHub does not give fork pull requests this repository's secrets, so the Stripe test-mode lane cannot run and release-gate stays red by design. A maintainer must push the branch to $GITHUB_REPOSITORY and let CI run there."
          else
            message="The STRIPE_TEST_SECRET_KEY Actions secret is not set on $GITHUB_REPOSITORY. The release lane requires a Stripe test-mode key (sk_test_...)."
          fi
          echo "::error title=Stripe test lane did not run::$message"
          printf '### Stripe test-mode integration did not run\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      # Time-boxed per attempt (see the e2e job) so a stalled start retries
      # instead of consuming the whole job budget.
      - if: steps.gate.outputs.run == 'true'
        name: Start isolated Stripe test database
        run: bash scripts/ci-supabase-start.sh logflare,vector,studio,realtime,edge-runtime,imgproxy
      - if: steps.gate.outputs.run == 'true'
        run: node scripts/prepare-ci-supabase.mjs

      - if: steps.gate.outputs.run == 'true'
        name: Stripe test-mode integration
        run: npm run test:stripe

      # JUnit for the Intelligence OS: every job's files share the prefix
      # test-results-<sha>- (docs/ids.md). Kept on red runs too.
      - name: Retain JUnit results
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.sha }}-stripe-integration
          path: |
            test-results/stripe.xml
          if-no-files-found: warn
          retention-days: 30

  # Plan 2 item A4 (review finding #162, OS id R-unproven): the configuration
  # DRVN launches with, in a browser. The e2e job above runs stub payments,
  # the agent on, shipping and the importer stubbed and the public data cache
  # off; none of that is what launches. This lane builds and serves the app
  # from the recorded launch configuration
  # (docs/release-evidence/launch-configuration.json): Stripe test mode, the
  # cache on, the agent off, DRVN Shipping off. A handful of specs
  # (e2e-launch/), not a second copy of the suite. Skipped, like e2e, on a
  # documents-only pull request.
  e2e-launch:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    outputs:
      ran: ${{ steps.executed.outputs.ran }}
      passed: ${{ steps.executed.outputs.passed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      # A publishable key is public by design (it ships in every page); it is
      # a variable, not a secret, and must pair with the test secret key.
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_TEST_PUBLISHABLE_KEY }}
    steps:
      # As in stripe-integration: a fork's pull request gets neither value, so
      # the lane cannot run there and says exactly that.
      - name: Require Stripe test keys
        id: gate
        env:
          FORK_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.head.repo.full_name || '' }}
        run: |
          missing=""
          [ -n "$STRIPE_SECRET_KEY" ] || missing="the STRIPE_TEST_SECRET_KEY Actions secret (sk_test_...)"
          if [ -z "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" ]; then
            missing="${missing:+$missing and }the STRIPE_TEST_PUBLISHABLE_KEY Actions variable (pk_test_...)"
          fi
          if [ -z "$missing" ]; then exit 0; fi
          if [ -n "$FORK_REPO" ]; then
            message="This pull request comes from the fork $FORK_REPO. GitHub does not give fork pull requests this repository's secrets or variables, so the launch-configuration lane cannot run and release-gate stays red by design. A maintainer must push the branch to $GITHUB_REPOSITORY and let CI run there."
          else
            message="$GITHUB_REPOSITORY is missing $missing. The launch-configuration lane takes a real Stripe test-mode payment and needs both."
          fi
          echo "::error title=Launch-configuration lane did not run::$message"
          printf '### Launch-configuration lane did not run\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The two keys must be the test pair of one Stripe account, or every
      # spec would fail somewhere inside Stripe's form. Asked of Stripe
      # directly, before anything is installed or built: a payment the secret
      # key creates must be readable with the publishable key.
      - name: Stripe test keys are a pair
        run: node e2e-launch/check-stripe-pair.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci

      # Auth, Storage (a listing needs a photo) and the database; no Realtime.
      - name: Start isolated Supabase
        run: bash scripts/ci-supabase-start.sh logflare,vector,studio,realtime,edge-runtime,imgproxy
      # PAYMENTS_MODE is not "stub" here, so no stub row is written: the
      # database enforces payout readiness, as it will in production.
      - run: node scripts/prepare-ci-supabase.mjs
      - run: npx playwright install --with-deps chromium

      - name: Launch-configuration browser lane
        id: executed
        run: |
          echo "ran=true" >> "$GITHUB_OUTPUT"
          npx playwright test -c playwright.launch.config.ts
          echo "passed=true" >> "$GITHUB_OUTPUT"

      # JUnit for the Intelligence OS: every job's files share the prefix
      # test-results-<sha>- (docs/ids.md). Kept on red runs too.
      - name: Retain JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.sha }}-e2e-launch
          path: |
            test-results/playwright-launch.xml
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: launch-lane-failure-details
          path: test-results/launch/
          retention-days: 3

  release-gate:
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, verify, secrets, secrets-full, sql-guard, e2e-parts, e2e, e2e-launch, stripe-integration]
    steps:
      - name: Require executed verification
        id: require
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          VERIFY: ${{ needs.verify.result }}
          SECRETS: ${{ needs.secrets.result }}
          SECRETS_FULL: ${{ needs.secrets-full.result }}
          SQL: ${{ needs.sql-guard.result }}
          E2E_PARTS: ${{ needs.e2e-parts.result }}
          E2E: ${{ needs.e2e.result }}
          STRIPE: ${{ needs.stripe-integration.result }}
          E2E_RAN: ${{ needs.e2e.outputs.ran }}
          E2E_FIRST_ATTEMPT: ${{ needs.e2e.outputs.first_attempt_passed }}
          LAUNCH: ${{ needs.e2e-launch.result }}
          LAUNCH_RAN: ${{ needs.e2e-launch.outputs.ran }}
          LAUNCH_PASSED: ${{ needs.e2e-launch.outputs.passed }}
          STRIPE_RAN: ${{ needs.stripe-integration.outputs.ran }}
        # Every requirement is checked and named, so a red gate says which
        # suite it is waiting on rather than failing on the first bare test.
        # Each outcome is also kept for the per-commit record below.
        run: |
          failed=0
          : > "$RUNNER_TEMP/requirements.jsonl"
          require() {
            if [ "$2" = "$3" ]; then
              echo "ok: $1"
              ok=true
            else
              echo "::error title=release-gate::$1 is '${2:-unset}', needs '$3'"
              failed=1
              ok=false
            fi
            jq -cn --arg name "$1" --arg value "${2:-unset}" --arg needs "$3" --argjson ok "$ok" \
              '{($name): {value: $value, needs: $needs, ok: $ok}}' >> "$RUNNER_TEMP/requirements.jsonl"
          }
          # Plan 2 items A0 and A4, and finding F1. The two browser lanes (e2e,
          # and e2e-launch for the launch configuration) and the Stripe
          # test-mode lane may be skipped for exactly one reason: this is a
          # pull request, the `changes` job succeeded, and it said the diff is
          # documents only. Then each must be 'skipped', never failed,
          # cancelled or run. In every other case each must have run and
          # passed (the browser lanes on their first attempt).
          scope=full
          if [ "$EVENT" = pull_request ] && [ "$CHANGES" = success ] && [ "$DOCS_ONLY" = true ]; then
            scope=documents-only
          fi
          echo "$scope" > "$RUNNER_TEMP/change-scope"
          echo "change scope: $scope"
          require "change scope decided" "$CHANGES" success
          require verify "$VERIFY" success
          require secrets "$SECRETS" success
          require secrets-full "$SECRETS_FULL" success
          require sql-guard "$SQL" success
          if [ "$scope" = documents-only ]; then
            require "e2e parts (documents-only pull request: skipped by design)" "$E2E_PARTS" skipped
            require "e2e (documents-only pull request: skipped by design)" "$E2E" skipped
            require "e2e-launch (documents-only pull request: skipped by design)" "$LAUNCH" skipped
            require "stripe-integration (documents-only pull request: skipped by design)" "$STRIPE" skipped
          else
            # The browser suite runs as four parts (e2e-parts); the e2e job
            # judges them. Both are required: the parts' own result, and the
            # judgement that each one ran and passed on its first attempt.
            require "e2e parts (all four)" "$E2E_PARTS" success
            require e2e "$E2E" success
            require "e2e executed" "$E2E_RAN" true
            require "e2e first attempt passed (diagnostic retries never count)" "$E2E_FIRST_ATTEMPT" true
            require e2e-launch "$LAUNCH" success
            require "e2e-launch executed" "$LAUNCH_RAN" true
            require "e2e-launch passed (launch configuration, no retries)" "$LAUNCH_PASSED" true
            require stripe-integration "$STRIPE" success
            require "stripe-integration executed" "$STRIPE_RAN" true
          fi
          exit "$failed"

      # The per-commit record for the Intelligence OS (docs/ids.md): one file
      # that says whether this commit got a finished green gate, and why not.
      # Written and kept on every outcome, red included.
      - name: Fetch the browser summary for the record
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-release-summary-${{ github.sha }}
          path: ${{ runner.temp }}/browser-summary

      - name: Write the release-gate record
        if: always()
        env:
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RESULT: ${{ steps.require.outcome }}
          E2E_FIRST_ATTEMPT: ${{ needs.e2e.outputs.first_attempt_passed }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-gate"
          summary="$RUNNER_TEMP/browser-summary/browser-release-$SHA.json"
          counts=null
          if [ -s "$summary" ]; then counts=$(jq -c '.counts' "$summary"); fi
          requirements='{}'
          if [ -s "$RUNNER_TEMP/requirements.jsonl" ]; then requirements=$(jq -cs 'add' "$RUNNER_TEMP/requirements.jsonl"); fi
          # "documents-only" means the browser suite was skipped by design
          # (plan 2 item A0); only a pull request can carry it.
          scope=unknown
          if [ -s "$RUNNER_TEMP/change-scope" ]; then scope=$(cat "$RUNNER_TEMP/change-scope"); fi
          jq -n \
            --arg sha "$SHA" --arg head_sha "$HEAD_SHA" --arg ref "$REF" --arg event "$EVENT" --arg scope "$scope" \
            --arg result "${RESULT:-unknown}" --argjson run_id "$RUN_ID" --argjson run_attempt "$RUN_ATTEMPT" \
            --argjson requirements "$requirements" \
            --argjson first_attempt_passed "$([ "$E2E_FIRST_ATTEMPT" = true ] && echo true || echo false)" \
            --argjson browser_counts "$counts" \
            '{sha: $sha, head_sha: $head_sha, ref: $ref, event: $event, run_id: $run_id, run_attempt: $run_attempt,
              scope: $scope, result: $result, requirements: $requirements, first_attempt_passed: $first_attempt_passed,
              browser_counts: $browser_counts}' > "$RUNNER_TEMP/release-gate/release-gate-$SHA.json"
          cat "$RUNNER_TEMP/release-gate/release-gate-$SHA.json"

      - name: Retain the release-gate record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate-${{ github.sha }}
          path: ${{ runner.temp }}/release-gate/release-gate-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30

  # The honest green: says out loud what did and didn't run, so a passing
  # build can't be mistaken for full coverage.
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, verify, secrets, secrets-full, sql-guard, e2e-parts, e2e, e2e-launch, stripe-integration]
    if: always()
    steps:
      - name: Coverage summary
        run: |
          {
            echo "## What this build actually verified"
            echo ""
            echo "| Suite | Result |"
            echo "|---|---|"
            echo "| Typecheck / lint / unit / build / production advisories | ${{ needs.verify.result }} |"
            echo "| Secret scan, incremental (this PR's / push's first-parent, non-merge commits) | ${{ needs.secrets.result }} |"
            echo "| Secret scan, full (all reachable commits incl. merges + tracked tree) | ${{ needs.secrets-full.result }} |"
            echo "| SQL guards (all registered suites) | ${{ needs.sql-guard.result }} |"
            echo "| Change scope (documents-only pull requests skip the browser suite and the Stripe lane) | ${{ needs.changes.result }}; documents only=${{ needs.changes.outputs.docs_only || 'false' }} |"
            echo "| Browser suite parts (four, side by side) | ${{ needs.e2e-parts.result }} |"
            echo "| Required browser regression suite | ${{ needs.e2e.result }}; executed=${{ needs.e2e.outputs.ran || 'false' }}; first attempt passed=${{ needs.e2e.outputs.first_attempt_passed || 'false' }} |"
            echo "| Launch-configuration browser lane (Stripe test mode, cache on, agent and DRVN Shipping off) | ${{ needs.e2e-launch.result }}; executed=${{ needs.e2e-launch.outputs.ran || 'false' }}; passed=${{ needs.e2e-launch.outputs.passed || 'false' }} |"
            echo "| Stripe test-mode integration | ${{ needs.stripe-integration.result }}; executed=${{ needs.stripe-integration.outputs.ran }} |"
            echo "| JUnit results (one artifact per job, prefix \`test-results-${{ github.sha }}-\`) | verify, sql-guard, e2e, stripe-integration; see docs/ids.md |"
            echo "| Provider coverage | Stripe test API covers multi-seller capture and late compensation. The main browser suite uses stubs; the launch lane takes one real test-mode card payment, presented through Stripe's API after the card form has mounted. Connected payout/dispute and 3DS browser proof remain open |"
          } >> "$GITHUB_STEP_SUMMARY"
