# The deploy pipeline (N634, N528; remediation plan D2 and C3).
#
# Staging: every push to main, once that commit's release-gate check has
# passed and staging's database has every migration on disk. The host builds
# and serves exactly that commit, and the job waits until staging's
# /api/version reports it.
# Production: by hand only (workflow_dispatch), for an annotated release tag
# rc-YYYYMMDD[-n] on main whose release-gate passed, through the "production"
# environment (the owner sets its required reviewers), with the same
# migration check and the sandbox overrides absent from the host (N540).
# The tag must be annotated (who made it, and when), not cryptographically
# signed: the sign-off is the production environment's required reviewer,
# who approves the run in GitHub (report five #113).
#
# Neither job applies a migration: migrations are applied by the session that
# merges them, before the merge (supabase/MIGRATIONS.md). A missing file stops
# the deploy so a person applies it with the runner.
#
# Off until the owner sets it up (docs/staging-setup.md §4, §11): the staging
# job runs only when the repository variable DRVN_DEPLOY_STAGING is 'true'.
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_STAGING_PROJECT_ID,
# VERCEL_PRODUCTION_PROJECT_ID, STAGING_SUPABASE_READER_PASSWORD,
# PRODUCTION_SUPABASE_READER_PASSWORD, ADMIN_ALERT_WEBHOOK_URL. Variables:
# DRVN_DEPLOY_STAGING, DRVN_STAGING_ORIGIN, DRVN_PRODUCTION_ORIGIN,
# DRVN_STAGING_SUPABASE_URL, DRVN_PRODUCTION_SUPABASE_URL. The two database
# secrets belong on the staging and production environments, not the
# repository (#123). On each hosting project (not here): DRVN_DEPLOY_ENV =
# staging or production, read at build through `vercel pull` (#121); the
# build refuses a hosted production build without it.
#
# Each hosted project names itself with DRVN_DEPLOY_ENV ("staging" or
# "production") in the host's own settings (docs/staging-setup.md §4), which
# decides at build whether the site may be indexed. The last check of each job
# asks the served site: staging must disallow every crawler, send noindex and
# serve no sitemap; production must be open. A staging site that would be
# indexed, or a production site hidden from search, fails the deploy.
#
# The migration check only reads one table, so it signs in as deploy_reader, a
# read-only database login (docs/staging-setup.md §11.4), and this workflow
# holds no database owner's password. The runner refuses that login if it
# could write.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy to production (an annotated rc-YYYYMMDD or rc-YYYYMMDD-n tag on main; the production environment's reviewer approves the run)
        required: true
        type: string

permissions:
  contents: read

# One deploy per environment at a time, and a newer main never cancels a
# deploy already under way (it waits, then deploys the newer commit).
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'push' && vars.DRVN_DEPLOY_STAGING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: staging
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      - name: Wait for release-gate on this commit
        run: node scripts/deploy.mjs gate "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Staging has every migration
        env:
          SUPABASE_URL: ${{ vars.DRVN_STAGING_SUPABASE_URL }}
          SUPABASE_DB_READER_PASSWORD: ${{ secrets.STAGING_SUPABASE_READER_PASSWORD }}
        run: |
          umask 077
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nSUPABASE_DB_READER_USER=deploy_reader\nSUPABASE_DB_READER_PASSWORD=%s\n' "$SUPABASE_URL" "$SUPABASE_DB_READER_PASSWORD" > "$RUNNER_TEMP/target.env"
          node scripts/apply-migration.mjs --target staging --env-file "$RUNNER_TEMP/target.env" --status > "$RUNNER_TEMP/status.json"
          rm -f "$RUNNER_TEMP/target.env"
          node scripts/deploy.mjs migrations "$RUNNER_TEMP/status.json"

      # Codex on #175: a delayed or re-run older run must not deploy over a
      # newer one. Asked again here, just before the build and deploy.
      - name: This commit is still main's head
        id: head
        run: node scripts/deploy.mjs current "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build and deploy this commit
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
        run: |
          npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 deploy --prebuilt --prod --env GIT_COMMIT_SHA="$GITHUB_SHA" --token="$VERCEL_TOKEN"

      - name: Staging reports this commit
        if: steps.head.outputs.current == 'true'
        run: node scripts/deploy.mjs version "$ORIGIN" "$GITHUB_SHA" staging
        env:
          ORIGIN: ${{ vars.DRVN_STAGING_ORIGIN }}

      - name: Tell the alert channel
        if: always()
        # A run that found a newer commit on main deploys nothing and still
        # ends "success": say so, not "deploy: success".
        run: |
          if [ "$STATUS" = "success" ] && [ "$CURRENT" != "true" ]; then
            node scripts/deploy.mjs alert "DRVN staging: ${GITHUB_SHA::7} was superseded by a newer commit on main, so this run deployed nothing"
          else
            node scripts/deploy.mjs alert "DRVN staging deploy of ${GITHUB_SHA::7}: $STATUS"
          fi
        env:
          STATUS: ${{ job.status }}
          CURRENT: ${{ steps.head.outputs.current }}
          ADMIN_ALERT_WEBHOOK_URL: ${{ secrets.ADMIN_ALERT_WEBHOOK_URL }}

  # Work review #139: a job that names an environment which does not exist
  # makes GitHub create it, empty and unprotected, and run. So this job, which
  # names no environment and runs the dispatched ref's script (not the release
  # tag's, which may predate the check), checks first that "production"
  # exists, has required reviewers and restricts what may deploy to it. The
  # production job cannot start until it passes. A run dispatched from another
  # branch brings its own workflow file; the environment's branch restriction
  # is what stops that, and this is the check that the restriction exists.
  production-guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
      - name: The production environment is guarded
        run: node scripts/check-branch-protection.mjs --environment production "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Tell the alert channel
        if: failure()
        run: |
          node scripts/deploy.mjs alert "DRVN production deploy of $TAG REFUSED before it started. The production environment is not guarded (see the run)."
        env:
          TAG: ${{ inputs.tag }}
          ADMIN_ALERT_WEBHOOK_URL: ${{ secrets.ADMIN_ALERT_WEBHOOK_URL }}

  production:
    if: github.event_name == 'workflow_dispatch'
    needs: production-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The owner gives this environment required reviewers in GitHub, so a
    # production deploy waits for a person's approval as well as the tag.
    # production-guard has just checked that it does.
    environment: production
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: The tag is an annotated release tag on main
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node scripts/deploy.mjs tag "$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::error::$TAG must be an annotated tag (git tag -a): a lightweight tag records no author or date"
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      - name: release-gate passed on the tagged commit
        run: node scripts/deploy.mjs gate "$SHA"
        env:
          SHA: ${{ steps.tag.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Production has every migration
        env:
          SUPABASE_URL: ${{ vars.DRVN_PRODUCTION_SUPABASE_URL }}
          SUPABASE_DB_READER_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_READER_PASSWORD }}
        run: |
          umask 077
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nSUPABASE_DB_READER_USER=deploy_reader\nSUPABASE_DB_READER_PASSWORD=%s\n' "$SUPABASE_URL" "$SUPABASE_DB_READER_PASSWORD" > "$RUNNER_TEMP/target.env"
          node scripts/apply-migration.mjs --target production --env-file "$RUNNER_TEMP/target.env" --status > "$RUNNER_TEMP/status.json"
          rm -f "$RUNNER_TEMP/target.env"
          node scripts/deploy.mjs migrations "$RUNNER_TEMP/status.json"

      - name: The sandbox overrides are absent from the host (N540)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCTION_PROJECT_ID }}
        run: |
          npx --yes vercel@65.2.0 env ls production --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/hosted-env.txt"
          npx --yes vercel@65.2.0 env ls preview --token="$VERCEL_TOKEN" >> "$RUNNER_TEMP/hosted-env.txt"
          node scripts/release-candidate.mjs hosted-env "$RUNNER_TEMP/hosted-env.txt"

      - name: Build and deploy the tagged commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCTION_PROJECT_ID }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 deploy --prebuilt --prod --env GIT_COMMIT_SHA="$SHA" --token="$VERCEL_TOKEN"

      - name: Production reports the tagged commit
        run: node scripts/deploy.mjs version "$ORIGIN" "$SHA" production
        env:
          ORIGIN: ${{ vars.DRVN_PRODUCTION_ORIGIN }}
          SHA: ${{ steps.tag.outputs.sha }}

      - name: Tell the alert channel
        if: always()
        run: |
          node scripts/deploy.mjs alert "DRVN production deploy of $TAG: $STATUS"
        env:
          TAG: ${{ inputs.tag }}
          STATUS: ${{ job.status }}
          ADMIN_ALERT_WEBHOOK_URL: ${{ secrets.ADMIN_ALERT_WEBHOOK_URL }}
